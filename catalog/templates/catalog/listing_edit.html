{% extends "base.html" %}
{% block title %}Edit listing{% endblock %}
{% block content %}
<h1>Edit listing</h1>
<p>{{ category_name }}</p>
{% include "catalog/_listing_photo.html" %}
<form method="post" action="/listings/{{ item.id }}/edit" enctype="multipart/form-data" novalidate>
  {% csrf_token %}
  {{ form.as_p }}
  <button type="submit">Save</button>
</form>
{% endblock %}
