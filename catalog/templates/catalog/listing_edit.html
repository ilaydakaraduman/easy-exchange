{% extends "base.html" %}
{% block title %}Edit listing{% endblock %}
{% block content %}
<h1>Edit listing</h1>
<p>{{ category_name }}</p>
{% if item.photo %}
  <img class="listing-photo" src="{{ item.photo.url }}" alt="{{ item.title }}">
{% else %}
  <div class="listing-photo listing-photo-placeholder"></div>
{% endif %}
<form method="post" action="/listings/{{ item.id }}/edit" enctype="multipart/form-data" novalidate>
  {% csrf_token %}
  {{ form.as_p }}
  <button type="submit">Save</button>
</form>
{% endblock %}
